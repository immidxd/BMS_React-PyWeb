name = "bms-instagram-dispatcher"
main = "src/index.js"
compatibility_date = "2026-08-11"
workers_dev = true

[vars]
INSTAGRAM_APP_ID = "<instagram-app-id>"
META_API_VERSION = "v26.0"
INSTAGRAM_REDIRECT_URI = "https://bms-instagram-dispatcher.<your-subdomain>.workers.dev/oauth/instagram/callback"
EXPECTED_IG_USERNAME = "brandxstoreua"
INSTAGRAM_LIVE_ENABLED = "false"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "bms-instagram-dispatcher"
database_id = "<create-with-wrangler>"

# Secrets are added only through `wrangler secret put` and never committed:
# BMS_DISPATCHER_KEY, INSTAGRAM_APP_SECRET, TOKEN_ENCRYPTION_KEY,
# META_WEBHOOK_VERIFY_TOKEN.
