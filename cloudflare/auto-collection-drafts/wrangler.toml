name = "bms-auto-collection-drafts"
main = "src/index.js"
compatibility_date = "2026-08-21"
workers_dev = true

[observability]
enabled = true

[vars]
DRAFT_ONLY = "true"

[triggers]
# ⚠️ Бюджет Neon (CLAUDE.md, ≤ $3/міс): кожен запуск будить хмарну БД на ~6 хв.
# Раніше */5 → база не спала НІКОЛИ (≈$19/міс). Тепер раз на 6 год (≈$0.30/міс):
# тижнева чернетка з'являється на розгляд не пізніше ніж за 6 год після свого часу
# (а коли BMS відкритий — його локальний цикл створює її раніше). Узгоджено з власником.
crons = ["17 */6 * * *"]
